name: Release Branch Build

# Sanity-checks that a release/* or hotfix/* branch can produce all platform
# artifacts. Uses a mock keystore — actual signed builds happen on tag push
# via release.yml.

on:
  push:
    branches:
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - 'release/**'
      - 'hotfix/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare temporary CI signing key
        run: |
          "$JAVA_HOME/bin/keytool" -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/ci.keystore" -storetype JKS \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.android"
          cp "$RUNNER_TEMP/ci.keystore" "$HOME/.android/debug.keystore"
          cat > keystore.properties <<EOF
          releaseKeystorePath=$RUNNER_TEMP/ci.keystore
          releaseKeystorePassword=android
          releaseKeyAlias=androiddebugkey
          releaseKeyPassword=android
          EOF
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all platforms (debug Android + desktop + web)
        run: |
          ./gradlew clean ktlintCheck \
            android:assembleFossDebug \
            desktop:packageLinuxX64 \
            desktop:packageWinX64 \
            html:packageWebDist
